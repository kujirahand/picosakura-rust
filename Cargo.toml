[package]
name = "picosakura"
version = "0.2.3" # picosakura
edition = "2021"
authors = ["kujirahand <web@kujirahand.com>"]
description = "Picosakura mml player"
license = "MIT"
repository = "https://github.com/kujirahand/picosakura-rust"
exclude = [
    "/picosakura-pack",
    "/samples/*.mid",
    "/*.sh", "/*.bat", "/*.mid", "/*.mml"]

[lib]
crate-type = ["cdylib"]

[dependencies]
rustysynth = "1.3.6"
sakuramml = { version = "0.2.3", optional = true }
sakuramml-v2 = { version = "2.1.1", optional = true }
tinyaudio = "0.1.3"
wav_io = "0.1.14"
wasm-bindgen = "0.2"

[features]
# choose one MML compiler: `cargo build --no-default-features --features sakuramml-v2`
default = ["sakuramml"]
sakuramml = ["dep:sakuramml"]
sakuramml-v2 = ["dep:sakuramml-v2"]
